<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian · KCL example · Icon Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&text=子午正影线&display=swap" rel="stylesheet">
<style>
  /* KCL example: Icon Center, Duotone mode. Tension: a solar disk held by a surveyor's wheel. */
  :root {
    --paper: #e9e4d6;
    --ink: #070807;
    --signal: #0e9a62;
    --signal-2: #0b3a36;
    --ghost: color-mix(in oklab, var(--paper) 14%, transparent);
    --display: "Instrument Serif", "Liberation Serif", "Times New Roman", serif;
    --text: "IBM Plex Mono", "DejaVu Sans Mono", monospace;
    --cjk: "Noto Serif SC", "Noto Serif CJK SC", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--text); display: grid; place-items: center; }

  /* Fixed 16:9 stage, letterboxed (archetype 2). */
  .stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; background: var(--ink); }
  .stage > * { position: absolute; inset: 0; }
  .l-plane { z-index: 1; }
  .l-type-plane { z-index: 2; }
  .l-subject { z-index: 3; }
  .l-system { z-index: 4; pointer-events: none; }
  .l-signal { z-index: 5; pointer-events: none; }
  .l-type { z-index: 6; pointer-events: none; }
  .l-overlay { z-index: 7; pointer-events: none; }
  .stage svg.full { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Plane layer: duotone ground band, frame, container, label bar. */
  .band-2 { position: absolute; left: 0; right: 0; top: 18%; height: 64%; background: var(--signal-2); }
  .frame { position: absolute; inset: 2% 2%; border: 1px solid var(--paper); opacity: 0.55; }
  .container { position: absolute; left: 50%; top: 53%; width: 34.9%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: var(--signal); }
  .label-bar { position: absolute; left: 0; right: 0; top: 53%; height: 5.2%; translate: 0 -50%; background: var(--ink); }
  .label-bar span { position: absolute; left: 50%; top: 50%; translate: -50% -50%; font: 500 12px/1 var(--text); letter-spacing: 0.42em; text-transform: uppercase; color: var(--paper); white-space: nowrap; }
  .label-bar span::before, .label-bar span::after { content: ""; position: absolute; top: 50%; width: 9vw; max-width: 140px; height: 1px; background: var(--paper); opacity: 0.6; }
  .label-bar span::before { right: calc(100% + 1.6em); } .label-bar span::after { left: calc(100% + 1.2em); }

  /* Plane type inside the container only (clip), stretched 1.9× along Y, outlined. */
  .plane-type {
    position: absolute; left: 50%; top: 53%; translate: -50% -50%;
    font: 400 25vw/0.8 var(--display); letter-spacing: 0.02em; white-space: nowrap; user-select: none;
    transform: scaleY(1.9); color: color-mix(in oklab, var(--paper) 26%, transparent);
  }
  .l-type-plane { clip-path: circle(21.5% at 50% 53%); }

  /* Type roles. */
  .mark { position: absolute; font: 400 11px/1 var(--text); letter-spacing: 0.3em; text-transform: uppercase; white-space: nowrap; color: var(--paper); }
  .mark.tl { left: 4.2%; top: 5.6%; } .mark.tr { right: 4.2%; top: 5.6%; }
  .mark.bl { left: 4.2%; bottom: 5.6%; } .mark.br { right: 4.2%; bottom: 5.6%; }
  .title { position: absolute; left: 50%; bottom: 9.5%; translate: -50% 0; font: 400 13px/1 var(--text); letter-spacing: 0.5em; text-transform: uppercase; white-space: nowrap; }
  .title .cjk { font: 500 20px/1 var(--cjk); letter-spacing: 0.6em; vertical-align: -2px; }
  .voice { position: absolute; top: 41%; translate: 0 -50%; margin: 0; max-width: 20ch; font: italic 400 clamp(14px, 1.25vw, 19px)/1.45 var(--display); color: var(--paper); }
  .voice.left { left: 4.2%; text-align: left; } .voice.right { right: 4.2%; text-align: right; }

  /* Subject: the solar disk in two levels, paper disk and a line ghost above it. */
  .disk { position: absolute; left: 50%; top: 58%; width: 20.8%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: var(--paper); }
  .disk-cut { position: absolute; left: 50%; top: 58%; width: 24%; height: 2.2%; translate: -50% 150%; background: var(--signal); }

  /* Overlay: scanlines. */
  .l-overlay { background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,0.22) 3px 4px); }

  @media (max-aspect-ratio: 1/1) {
    .stage { width: 100vw; aspect-ratio: 4 / 5; }
    .fan { display: none; }
    .voice.left { top: auto; bottom: 16%; translate: 0; } .voice.right { top: auto; bottom: 16%; translate: 0; }
    .mark.tr, .mark.bl, .mark.br { display: none; }
    .l-type-plane { clip-path: circle(28% at 50% 53%); }
    .container { width: 70%; }
  }
  /* Motion (MOT): wheel rotates, burst breathes, split sways. Three systems, overlay still. */
  .wheel { transform-box: view-box; transform-origin: 720px 430px; animation: spin 240s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .burst { transform-box: view-box; transform-origin: 720px 470px; animation: breathe 9s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.045); } }
  .split-a { animation: sway 7s ease-in-out infinite alternate; }
  .split-b { animation: sway 7s ease-in-out infinite alternate-reverse; animation-delay: -3.5s; }
  @keyframes sway { from { transform: translateX(-3px); } to { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .stage *, .band *, main * { animation-play-state: paused !important; } }

</style>
