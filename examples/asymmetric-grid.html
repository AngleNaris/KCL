<style>
  /* KCL example: Asymmetric Grid, Mono mode. Tension: a hill pressed flat, pinned by a twelve-column grid. */
  :root {
    --paper: #ece7da;
    --ink: #1c1b19;
    --signal: #f5c400;
    --ghost: color-mix(in oklab, var(--ink) 12%, transparent);
    --display: "Big Shoulders Display", "Liberation Sans Narrow", "Arial Narrow", sans-serif;
    --text: "JetBrains Mono", "DejaVu Sans Mono", monospace;
    --cjk: "Noto Serif SC", "Noto Serif CJK SC", serif;
    --margin: 4%;
    --gutter: 2vw;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; color: var(--ink); font-family: var(--text); }

  /* The stage is a 12-column grid (archetype 3). Subject and System bleed under it. */
  .stage { position: relative; min-height: 100vh; overflow: hidden;
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(12, 1fr);
    column-gap: var(--gutter); padding: calc(var(--margin) * 0.75) var(--margin); }
  .bleed { position: absolute; inset: 0; pointer-events: none; }
  .l-subject { z-index: 1; }
  .l-system { z-index: 3; }
  .l-signal { z-index: 4; }
  .l-overlay { z-index: 8; }
  .stage > .cell { position: relative; z-index: 5; }
  .stage svg.full { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Plane layer: column-aligned ink bars. */
  .bar-a { grid-column: 7 / 10; grid-row: 8 / 9; background: var(--ink); z-index: 2; align-self: center; height: 56%; }
  .bar-b { grid-column: 1 / 4; grid-row: 2 / 3; background: var(--ink); z-index: 2; align-self: start; height: 14%; }

  /* Plane type: vertical, condensed, stretched along its reading axis, bleeding off the bottom. */
  .plane-type { grid-column: 10 / 13; grid-row: 1 / 13; z-index: 2; justify-self: center; align-self: start;
    writing-mode: vertical-rl; font: 900 11.5vw/0.9 var(--display); letter-spacing: 0.02em; text-transform: uppercase;
    transform: scaleY(1.35); transform-origin: top center; color: var(--ink); margin-top: -2vh; user-select: none; }

  /* Mark type at the content corners. */
  .mark { position: absolute; z-index: 6; padding: 0.5em 0.7em; margin: -0.5em -0.7em; background: var(--paper); font: 400 11px/1 var(--text); letter-spacing: 0.3em; text-transform: uppercase; white-space: nowrap; }
  .mark.tl { left: var(--margin); top: 3%; } .mark.tr { right: var(--margin); top: 3%; }
  .mark.bl { left: var(--margin); bottom: 3%; } .mark.br { right: var(--margin); bottom: 3%; }
  .mark.cjk { font: 600 15px/1 var(--cjk); letter-spacing: 0.5em; }

  /* Voice in the quiet zone, four columns wide. */
  .voice { grid-column: 5 / 9; grid-row: 3 / 6; align-self: start; justify-self: start; margin: 0; padding: 0.7em 0.9em; background: var(--paper);
    font: 400 clamp(13px, 1.05vw, 16px)/1.65 var(--text); }
  .voice b { font-weight: 700; }

  .l-overlay { background-image: radial-gradient(var(--ink) 0.55px, transparent 0.7px); background-size: 4px 4px; opacity: 0.16; }

  /* Motion (MOT): contours rotate around the pin, rhythm points drift along the diagonal, stars twinkle. */
  .contours { transform-box: view-box; transform-origin: 300px 620px; animation: spin 320s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .rhythm { animation: along 41s ease-in-out infinite alternate; }
  @keyframes along { to { transform: translate(14px, 8px); } }
  .marks path { transform-box: fill-box; transform-origin: center; animation: twinkle 2.9s ease-in-out infinite; animation-delay: calc(var(--i, 0) * -0.9s); }
  @keyframes twinkle { 50% { transform: scale(0.72); opacity: 0.8; } }
  @media (prefers-reduced-motion: reduce) { .stage *, .band *, main * { animation-play-state: paused !important; } }

  @media (max-width: 1100px) {
    .stage { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .bar-a { grid-column: 4 / 6; } .bar-b { grid-column: 1 / 3; }
    .plane-type { grid-column: 5 / 7; font-size: 16vw; }
    .voice { grid-column: 2 / 5; }
  }
  @media (max-width: 720px) {
    .stage { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .bar-a { grid-column: 3 / 5; } .bar-b { grid-column: 1 / 3; }
    .plane-type { grid-column: 1 / 5; grid-row: 1 / 3; writing-mode: horizontal-tb; font-size: 24vw; transform: scaleY(1.6); margin-top: 1vh; justify-self: start; }
    .voice { grid-column: 1 / 4; grid-row: 4 / 7; }
    .mark.bl, .mark.tr { display: none; }
  }
</style>
